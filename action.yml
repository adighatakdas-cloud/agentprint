name: agentprint
description: >-
  Stop AI-agent files (.claude/, .codex/) and leaked API keys from shipping in your npm/PyPI
  package or sitting in your repo. Offline; keys are always shown redacted.
author: adighatakdas-cloud
branding:
  icon: shield
  color: red

inputs:
  command:
    description: >-
      `pack` checks what your npm/PyPI package would publish. `scan` checks the agent settings
      files in your repository (never the runner's home directory).
    required: false
    default: pack
  path:
    description: Project directory, or for `pack` an already-built .tgz/.tar.gz/.whl/.zip.
    required: false
    default: "."
  fail-on:
    description: >-
      Fail when a finding is at or above this severity: low, medium, high, critical, or none
      (report only).
    required: false
    default: high
  upload-sarif:
    description: >-
      "true" uploads the results to GitHub code scanning (the Security tab). The job needs
      `permissions: security-events: write`; private repositories also need GitHub Code Security.
    required: false
    default: "false"
  badge-dir:
    description: >-
      Folder to write `badge.json` (a shields.io endpoint badge, CLEAR or BLOCK) and
      `verdict.json` (counts only, no paths or findings) into. Empty (default) writes nothing.
      Needs no extra permissions.
    required: false
    default: ""
  attest-badge:
    description: >-
      "true" signs `badge.json` with a GitHub build attestation (sigstore): a workflow run in this
      repository signed this exact file, with agentprint's verdict attached. It does not prove
      the workflow ran agentprint unchanged. Needs `badge-dir`. The job needs
      `permissions: id-token: write` and `attestations: write`. Skipped with a notice on private
      repositories, and with a warning when `fail-on` is `none` (report-only runs never sign a
      CLEAR).
    required: false
    default: "false"
  publish-badge:
    description: >-
      "true" commits `badge.json` and `verdict.json` to the orphan branch `agentprint-badge`
      (one commit, force-updated), only on a push to the default branch and not when `fail-on` is
      `none` (a warning is logged instead); needs `badge-dir`. The
      job needs `permissions: contents: write`. "dry-run" prints what would be committed and
      pushes nothing (needs no permissions).
    required: false
    default: "false"

outputs:
  exit-code:
    description: "agentprint's exit code: 0 nothing at or above fail-on, 1 findings, 2 error."
    value: ${{ steps.run.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF report (set whenever agentprint ran without an error).
    value: ${{ steps.run.outputs.sarif-file }}
  badge-file:
    description: Path of badge.json (set when `badge-dir` is given and agentprint ran without an error).
    value: ${{ steps.run.outputs.badge-file }}
  verdict-file:
    description: Path of verdict.json (set together with badge-file).
    value: ${{ steps.run.outputs.verdict-file }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: latest-known # newest uv whose checksum this setup-uv release knows
        enable-cache: "false" # don't write into the caller's Actions cache
        working-directory: ${{ github.action_path }}

    # Runs agentprint from this action's own checkout (pinned by the caller's `uses:` ref)
    # until it is on PyPI.
    - name: Install agentprint
      shell: bash
      run: uv sync --quiet --locked --no-dev --project "$GITHUB_ACTION_PATH"

    - name: Run agentprint
      id: run
      shell: bash
      env:
        AP_COMMAND: ${{ inputs.command }}
        AP_PATH: ${{ inputs.path }}
        AP_FAIL_ON: ${{ inputs.fail-on }}
        AP_BADGE_DIR: ${{ inputs.badge-dir }}
        AP_ATTEST: ${{ inputs.attest-badge }}
        AP_PUBLISH: ${{ inputs.publish-badge }}
        COLUMNS: "160"
      run: |
        set +e  # keep going on findings: the last step reports the exit code
        set -uo pipefail
        ap() { uv run --quiet --no-sync --project "$GITHUB_ACTION_PATH" agentprint "$@"; }
        case "$AP_COMMAND" in
          scan) cmd=(scan --no-home) ;;
          pack) cmd=(pack) ;;
          *)
            echo "::error title=agentprint::input 'command' must be 'scan' or 'pack'"
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        # A badge that is signed or published counts every print: the repository's own
        # .agentprint.toml or baseline must not be able to turn it CLEAR (agentprint's --no-config).
        if [ "$AP_ATTEST" = "true" ] || [ "$AP_PUBLISH" = "true" ] || [ "$AP_PUBLISH" = "dry-run" ]; then
          cmd+=(--no-config)
        fi
        badge=()
        if [ -n "$AP_BADGE_DIR" ]; then
          mkdir -p "$AP_BADGE_DIR"
          badge=(--badge "$AP_BADGE_DIR")
        fi
        # Table for the log; this run's exit code is the result.
        ap "${cmd[@]}" --fail-on "$AP_FAIL_ON" --format table ${badge[@]+"${badge[@]}"} -- "$AP_PATH"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -le 1 ] && [ -n "$AP_BADGE_DIR" ] && [ -f "$AP_BADGE_DIR/badge.json" ] && [ -f "$AP_BADGE_DIR/verdict.json" ]; then
          echo "badge-file=$AP_BADGE_DIR/badge.json" >> "$GITHUB_OUTPUT"
          echo "verdict-file=$AP_BADGE_DIR/verdict.json" >> "$GITHUB_OUTPUT"
        fi
        if [ "$code" -le 1 ]; then
          sarif="$RUNNER_TEMP/agentprint-$AP_COMMAND.sarif"
          ap "${cmd[@]}" --fail-on "$AP_FAIL_ON" --format sarif -- "$AP_PATH" > "$sarif"
          if [ "$?" -le 1 ]; then
            echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=agentprint::could not write the SARIF report"
          fi
        fi

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: agentprint-${{ inputs.command }}

    # Sign badge.json (the verdict is the predicate): this records that a workflow in this
    # repository signed these bytes, not that it ran agentprint unchanged. Only on a push to the
    # default branch (same rule as publishing: a pull request never signs), only on a public
    # repository (private ones would need GitHub Enterprise for attestations), and never for a
    # report-only run (fail-on none), which must not publish a signed CLEAR.
    - name: Attest the badge
      if: inputs.attest-badge == 'true' && inputs.fail-on != 'none' && steps.run.outputs.badge-file != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.repository.private
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ steps.run.outputs.badge-file }}
        predicate-type: https://adighatakdas-cloud.github.io/agentprint/badge/v1
        predicate-path: ${{ steps.run.outputs.verdict-file }}

    - name: Skip signing and publishing a report-only run
      if: (inputs.attest-badge == 'true' || inputs.publish-badge == 'true') && inputs.fail-on == 'none'
      shell: bash
      run: echo "::warning title=agentprint::attest-badge and publish-badge skipped, fail-on is none (report only); a report-only run never publishes a signed CLEAR"

    - name: Skip attestation outside the default branch
      if: inputs.attest-badge == 'true' && !(github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      shell: bash
      run: echo "::notice title=agentprint::attest-badge skipped, the badge is only signed on a push to the default branch"

    - name: Skip attestation on a private repository
      if: inputs.attest-badge == 'true' && github.event.repository.private
      shell: bash
      run: echo "::notice title=agentprint::attest-badge skipped, this repository is private (build attestations need a public repository)"

    # Never on pull_request (a fork's PR gets no write token); only a push to the default branch.
    - name: Publish badge to the agentprint-badge branch
      if: inputs.publish-badge == 'true' && inputs.fail-on != 'none' && steps.run.outputs.badge-file != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        AP_BADGE_DIR: ${{ inputs.badge-dir }}
        AP_PUBLISH_MODE: "true"
        AP_REPOSITORY: ${{ github.repository }}
        AP_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/publish-badge.sh"

    - name: Skip publishing the badge
      if: inputs.publish-badge == 'true' && !(github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      shell: bash
      run: echo "::notice title=agentprint::publish-badge skipped, the badge is only published on a push to the default branch"

    - name: Dry-run publish of the badge
      if: inputs.publish-badge == 'dry-run' && steps.run.outputs.badge-file != ''
      shell: bash
      env:
        AP_BADGE_DIR: ${{ inputs.badge-dir }}
        AP_PUBLISH_MODE: dry-run
      run: bash "$GITHUB_ACTION_PATH/scripts/publish-badge.sh"

    # Last, so the SARIF is uploaded even when findings fail the step.
    - name: Finish with agentprint's exit code
      shell: bash
      env:
        AP_EXIT: ${{ steps.run.outputs.exit-code }}
      run: exit "${AP_EXIT:-2}"
