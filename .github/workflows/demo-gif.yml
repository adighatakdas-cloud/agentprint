name: Demo GIF

# Renders a demo GIF with VHS and uploads it as a build artifact. Run by hand (Actions ->
# Demo GIF -> Run workflow) and pick the tape: demo/demo.tape makes docs/demo.gif,
# demo/agent_loop.tape makes docs/agent-loop.gif. Download the artifact, check it, and
# commit the GIF yourself. Nothing is committed or pushed by this workflow.
# The demo uses only a fake home and fake keys built by demo/build_demo.py.

on:
  workflow_dispatch:
    inputs:
      tape:
        description: Which tape to render
        type: choice
        options:
          - demo/demo.tape
          - demo/agent_loop.tape
        default: demo/demo.tape

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install agentprint from this checkout, as a user would with `uv tool install`
        run: |
          uv tool install .
          uv tool dir --bin >> "$GITHUB_PATH"
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
          path: ${{ inputs.tape }}
      - name: Find the GIF the tape wrote
        env:
          TAPE: ${{ inputs.tape }}
        run: |
          gif=$(sed -n 's/^Output //p' "$TAPE" | head -n 1)
          test -s "$gif" && ls -l "$gif"
          echo "GIF=$gif" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: ${{ env.GIF }}
          if-no-files-found: error
