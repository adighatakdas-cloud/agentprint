name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest  # add macos-latest when the repo goes public (private macOS minutes cost 10x)
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "integration or not integration"  # unit + integration
      - name: agentprint checks its own package
        run: uv run agentprint pack . --fail-on high
      - name: npm wrapper tests
        working-directory: npm
        run: npm test
      - name: agentprint checks the npm wrapper package
        run: uv run agentprint pack npm --fail-on high
