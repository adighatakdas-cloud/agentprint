name: Live agents

# Runs real agent CLIs (pinned versions) against a local mock model, in a throwaway HOME, to
# prove agentprint's hooks block a leaky publish/push inside each agent. No accounts, no real
# keys, no network to any model provider: see tests/live/. One job per agent, in parallel.

on:
  pull_request:
    paths:
      - "agentprint/integrations/**"
      - "agentprint/guard.py"
      - "agentprint/hook.py"
      - "agentprint/install.py"
      - "agentprint/commands.py"
      - "tests/live/**"
      - ".github/workflows/live-agents.yml"
  schedule:
    - cron: "17 4 * * *"  # nightly: catches agent CLI changes and drift in our pins
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cli: claude-code, tests: test_live_claude_code.py }
          - { cli: codex, tests: test_live_codex.py }
          - { cli: opencode, tests: test_live_opencode.py }
          - { cli: gemini, tests: test_live_gemini.py }
          - { cli: copilot, tests: test_live_copilot.py }
          - { cli: hermes, tests: test_live_hermes.py }
    name: live (${{ matrix.cli }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: uv sync --locked
      - name: Install ${{ matrix.cli }} (exact version, into a temp folder)
        run: uv run python -m tests.live.install_clis "$RUNNER_TEMP/agents" "${{ matrix.cli }}"
      - name: Live tests for ${{ matrix.cli }}
        env:
          AGENTPRINT_LIVE_TOOLS: ${{ runner.temp }}/agents
        run: uv run pytest -m live -v --durations=0 "tests/live/${{ matrix.tests }}"
