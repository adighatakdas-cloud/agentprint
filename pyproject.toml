[project]
name = "agentprint"
dynamic = ["version"]
description = "Find the secrets and risky permissions AI coding agents leave behind — on your machine and in the packages you publish."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "adighatakdas-cloud", email = "adi65das@gmail.com" }]
keywords = ["security", "secrets", "ai-agents", "claude-code", "codex", "npm", "pypi"]
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
]

[project.scripts]
agentprint = "agentprint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agentprint/__init__.py"

# Allowlist, not denylist: only these ever ship in the source package.
[tool.hatch.build.targets.sdist]
include = ["/agentprint", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pathlib.Path"]  # allow `= Path(".")` CLI defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs npm or uv build; run with -m integration",
    "live: drives a real agent CLI against a mock model; run with -m live",
]
addopts = "-m 'not integration and not live'"

[dependency-groups]
dev = [
    "fonttools>=4.68.0",
    "hypothesis==6.170.15",
    "jsonschema>=4.26.0",
    "libcst==1.8.6",
    "mutmut==3.4.0",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["agentprint", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonPlatform = "All"  # so Windows-only code (msvcrt) is checked on any machine

[tool.coverage.run]
source = ["agentprint"]

[tool.mutmut]
paths_to_mutate = [
    "agentprint/fix.py",
    "agentprint/pack.py",
    "agentprint/guard.py",
    "agentprint/secrets.py",
]
# Only the test files that exercise these four modules, so a mutant run stays short.
tests_dir = [
    "tests/test_properties.py",
    "tests/test_fix_mask.py",
    "tests/test_guard.py",
    "tests/test_secrets.py",
    "tests/test_pack.py",
]
also_copy = ["agentprint/", "tests/", "pyproject.toml", "README.md"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
