# pre-commit hooks (https://pre-commit.com). Both check the whole project, so they run once
# per commit and ignore the list of changed files.
- id: agentprint-pack
  name: agentprint pack
  description: Block the commit if agent files (.claude/, .codex/ …) or keys would ship in your npm/PyPI package.
  entry: agentprint pack
  language: python
  pass_filenames: false

- id: agentprint-scan
  name: agentprint scan
  description: Block the commit if agent settings files in this repository hold API keys.
  entry: agentprint scan --no-home
  language: python
  pass_filenames: false

# The same repository check before `git push` instead of each commit. Install the hook type with
# `pre-commit install --hook-type pre-push`, or list pre-push in default_install_hook_types.
- id: agentprint-pre-push
  name: agentprint scan (pre-push)
  description: Block the push if agent settings files in this repository hold API keys.
  entry: agentprint scan --no-home
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]
